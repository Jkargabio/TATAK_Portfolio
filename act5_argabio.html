<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Gallery</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        h1 {
            font-weight: normal;
            margin-bottom: 20px;
        }
        h1 em {
            color: red;
            font-style: italic;
        }
        table {
            border-collapse: collapse;
            margin: 0 auto;
        }
        td {
            padding: 5px;
            text-align: center;
            font-size: 14px;
        }
        img {
            width: 150px;
            height: 110px;
            object-fit: cover;
            border: 2px solid black;
            display: block;
        }
    </style>
</head>
<body>
    <h1>MY <em>PICTURE</em> GALLERY</h1>
    <table>
        <tr>
            <td>
                <a href="https://www.france.fr">
                    <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Tour_Eiffel_Wikimedia_Commons.jpg?width=300" alt="Eiffel Tower, France">
                </a>
                Eiffel Tower &ndash; France
            </td>
            <td>
                <a href="https://www.japan.travel">
                    <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Arakurayama Sengen Park - Japan.jpg?width=300" alt="Mount Fuji, Japan">
                </a>
                Mount Fuji &ndash; Japan
            </td>
            <td>
                <a href="https://www.egypt.travel">
                    <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Great Pyramid of Giza edge.jpg?width=300" alt="Great Pyramid, Egypt">
                </a>
                Great Pyramid &ndash; Egypt
            </td>
            <td>
                <a href="https://www.visitbrasil.com">
                    <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Christtheredeemer.jpg?width=300" alt="Christ the Redeemer, Brazil">
                </a>
                Christ the Redeemer &ndash; Brazil
            </td>
        </tr>
    </table>
</body>
</html>
