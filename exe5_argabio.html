<!DOCTYPE Html>

<html>
<head>
    <title>Other Formatting Tags</title>
</head>
<body>
    <h2><font color="green">Sample Output:</font></h2>
 
    <p><b><i><font color="red">Italic</font></i></b></p>
 
    <p><b><u><font color="blue">Underline</font></u></b></p>
 
    <p><b><font color="purple">Bold</font></b></p>
 
    <p><strike><font color="brown">Strikethrough</font></strike></p>
 
    <p><font color="orange">Superscript<sup>text</sup></font></p>
 
    <p><font color="teal">Subscript<sub>text</sub></font></p>
 
    <p><small><font color="gray">Small</font></small></p>
 
    <p><big><font color="magenta">Big</font></big></p>
 
    <p><mark>Mark / Highlight</mark></p>
</body>
</html>
